services:
  - type: web
    name: drc-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_TOKEN
        generateValue: true
      # Code du livreur principal : choisir une valeur lisible (ex. DRC-1234-5678), pas generateValue.
      - key: DRIVER_TOKEN
        sync: false
      - key: DRIVER_ID
        value: driver-1
      - key: DRIVER_NAME
        value: Livreur DRC
      - key: SHOP_PHONE
        value: "+221 77 000 00 00"
      # A décommenter avec les clés marchands (voir PAYMENTS.md) :
      # - key: WAVE_API_TOKEN
      #   sync: false
      # - key: WAVE_WEBHOOK_SECRET
      #   sync: false
      # - key: ORANGE_CLIENT_ID
      #   sync: false
      # - key: ORANGE_CLIENT_SECRET
      #   sync: false
      # - key: ORANGE_MERCHANT_KEY
      #   sync: false
    disk:
      name: drc-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
